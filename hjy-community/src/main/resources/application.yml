# ??????
hjy-community:
  # ??
  name: hjy-community
  # ??
  version: 1.0.0

# ??????
server:
  #????HTTP??
  port: 8080
  servlet:
    # ???????
    context-path: /
  tomcat:
    # tomcat?URI??
    uri-encoding: UTF-8
    # tomcat?????????200
    max-threads: 800
    # Tomcat?????????????25
    min-spare-threads: 30

# ????
logging:
  level:
#    com.msb: debug
    org.springframework: warn

# Spring配置
spring:
  profiles:
    active: druid
  # Jackson 全局时区（默认 UTC 会导致时间序列化差 8 小时）
  jackson:
    time-zone: GMT+8
  # 启动时自动加载本地真实配置（数据库账号密码、token密钥），与 application-druid.yml 同目录
  # 该文件被 .gitignore 排除不会提交；模板见同目录 application-local.yml.template
  config:
    import: optional:classpath:application-local.yml
  # 解决 Spring Boot 2.6+ 与 Swagger 2.9.2 兼容性问题
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # redis ??
  redis:
    # ??
    host: ${REDIS_HOST:localhost}
    # ??????6379
    port: 6379
    # ??
    password:
    # ??????
    timeout: 10s
    jedis:
      pool:
        # ???????????
        min-idle: 3
        # ???????????
        max-idle: 8
        # ????????????
        max-active: 8
        # #???????????????????????
        max-wait: -1ms
# MyBatis??

# PageHelper????
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

## mybatis-plus??
mybatis-plus:
  ## plus??????????????????????????????
  type-aliases-package: com.msb.hjycommunity.**.domain
  ## mybatis  mapper.xml???
  mapper-locations: classpath:mapper/**/*Mapper.xml
  ## mybatis  config???????

  config-location: classpath:mybatis/mybatis-config.xml
  ## ????
  global-config:
    db-config:
      ## id???????id
      id-type: assign_id
    ## ???mybatis-plus?banner
    banner: false

# token配置
token:
  # 请求头名称
  header: Authorization
  # JWT签名密钥（真实值在 application-local.yml 中）
  secret: ${TOKEN_SECRET}
  # token过期时间（分钟）
  expireTime: 30
