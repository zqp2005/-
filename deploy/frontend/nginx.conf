# 合家云前端 Nginx 配置
# - /            静态资源（Vue hash 路由，index.html 兜底）
# - /prod-api/   → hjy-community:8080（剥掉 /prod-api 前缀，与前端 .env.production 的 VUE_APP_BASE_API 对应）
# - /ai/         → hjy-ai-service:8090（SSE 流式对话，需关缓冲 + 长超时）
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1k;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /prod-api/ {
        proxy_pass http://community:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20m;
    }

    location /ai/ {
        proxy_pass http://ai-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 流式输出必需：HTTP/1.1 + 关闭缓冲
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
