# Server Configuration
server:
  port: 8090

spring:
  application:
    name: hjy-ai-service

  # Spring AI DeepSeek
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      connection-timeout: 60
      read-timeout: 120
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

  # Redis Configuration
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000

  # Jackson Configuration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: always

# AI Properties
hjy:
  ai:
    api-key: ${DEEPSEEK_API_KEY}
    model: deepseek-chat

    # 社区配置
    community:
      name: 合家云社区
      address: 智慧小区
      service-phone: 400-888-8888

    # 现有系统对接配置
    hjy-community:
      base-url: http://localhost:8080
      admin-username: ${HJY_COMMUNITY_ADMIN_USER:admin}
      admin-password: ${HJY_COMMUNITY_ADMIN_PASSWORD:admin123}
      api-token: ${HJY_COMMUNITY_API_TOKEN:}

# Logging Configuration
logging:
  level:
    root: INFO
    com.msb.hjy.ai: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always